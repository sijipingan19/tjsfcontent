# Merge with the ROOT compose.yaml; never replace teacher offline image tags.
# Parent must create runtime/events (uid 10001 writable) before starting.
services:
  api:
    image: ${COURSE_API_IMAGE:?Set COURSE_API_IMAGE to the freshly built student API image}
    environment:
      COURSE_EVENTS_ENABLED: "true"
      COURSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      COURSE_KAFKA_TOPIC: cinelab.activity.v1
      COURSE_EVENTS_RUNTIME: /app/runtime/events
    networks: [database, edge, events]
    volumes:
      - type: bind
        source: ${COURSE_EVENTS_RUNTIME_DIR:-./runtime/events}
        target: /app/runtime/events
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      kafka: {condition: service_healthy}

  web:
    image: ${COURSE_WEB_IMAGE:?Set COURSE_WEB_IMAGE to the freshly built student web image}

  kafka:
    image: ${COURSE_KAFKA_IMAGE:-apache/kafka:4.1.1}
    platform: linux/amd64
    pull_policy: missing
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka_data:/var/lib/kafka/data]
    networks: [events]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  events-consumer:
    image: ${COURSE_API_IMAGE:?Set COURSE_API_IMAGE to the freshly built student API image}
    platform: linux/amd64
    pull_policy: never
    entrypoint: [python, -m, recommender.student.consumer]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      APP_ENV: development
      APP_COOKIE_SECURE: "false"
      APP_ORIGIN: http://127.0.0.1:${COURSE_WEB_PORT:-8080}
      APP_DB_HOST: db
      APP_DB_NAME: rec_course_v3_fcfb9a195a_business
      APP_DB_USER: course_app
      APP_ENV_FILE: /dev/null
      COURSE_EVENTS_ENABLED: "true"
      COURSE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      COURSE_KAFKA_TOPIC: cinelab.activity.v1
      COURSE_EVENTS_RUNTIME: /app/runtime/events
      COURSE_KAFKA_GROUP_ID: cinelab-short-term-v1
    secrets: [app_password, jwt_secret]
    volumes:
      - type: bind
        source: ./data/packages/rec-course-v3-train5-1.0.0
        target: /app/data/packages/rec-course-v3-train5-1.0.0
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COURSE_EVENTS_RUNTIME_DIR:-./runtime/events}
        target: /app/runtime/events
        read_only: false
        bind:
          create_host_path: false
    networks: [database, events]
    depends_on:
      db: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test: [CMD, python, -c, "import json; from pathlib import Path; from datetime import datetime,timezone; s=json.loads(Path('/app/runtime/events/_consumer.json').read_text()); assert s['status']=='running' and (datetime.now(timezone.utc)-datetime.fromisoformat(s['last_poll_at'])).total_seconds()<30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

networks:
  events:
    internal: true

volumes:
  kafka_data:
